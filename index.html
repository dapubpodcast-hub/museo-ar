<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prueba Tierra AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        #mensaje {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-family: Arial, sans-serif;
            z-index: 9999;
            text-align: center;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div id="mensaje">
        Cargando Tierra 3D...
    </div>

    <a-scene
        embedded
        renderer="logarithmicDepthBuffer: true;"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>

            <a-asset-item
                id="earth"
                src="RobotExpressive.glb">
            </a-asset-item>

        </a-assets>

        <a-marker preset="hiro">

            <a-entity
                id="tierra"
                gltf-model="#earth"
                position="0 0.5 0"
                scale="0.05 0.05 0.05">
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>

        const tierra = document.querySelector('#tierra');
        const mensaje = document.querySelector('#mensaje');

        tierra.addEventListener('model-loaded', function () {

            mensaje.innerHTML = '🌎 ¡Tierra cargada! Apunta al marcador Hiro.';

        });

        tierra.addEventListener('model-error', function (error) {

            mensaje.innerHTML =
                '❌ ERROR: No se pudo cargar el modelo 3D.';

            console.error('Error cargando Tierra:', error);

        });

    </script>

</body>

</html>
