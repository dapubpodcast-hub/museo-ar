<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experimento con marcador</title>
  <link rel="manifest" href="manifest.webmanifest">
  <script src="lib/aframe.min.js"></script>
  <script src="lib/aframe-extras.min.js"></script>
  <script src="lib/aframe-ar.js"></script>
  <script src="experimentos.js"></script>
  <style>
    #mensaje{position:fixed;top:10px;left:10px;right:10px;padding:12px;background:rgba(0,0,0,.8);color:#fff;
      font-family:Arial,sans-serif;z-index:9999;text-align:center;border-radius:10px}
    #volver{position:fixed;bottom:12px;left:12px;z-index:9999;background:#7a1e1e;color:#fff;padding:10px 14px;
      border-radius:10px;font-family:Arial,sans-serif;text-decoration:none}
  </style>
</head>
<body style="margin:0;overflow:hidden">
  <div id="mensaje">Cargando…</div>
  <a id="volver" href="index.html">← Experimentos</a>
  <a-scene embedded renderer="logarithmicDepthBuffer: true;" arjs="sourceType: webcam; debugUIEnabled: false; cameraParametersUrl: lib/camera_para.dat;">
    <a-assets><a-asset-item id="modelo" src=""></a-asset-item></a-assets>
    <a-marker type="pattern" url="lib/patt.hiro">
      <a-entity id="exp" gltf-model="#modelo" animation-mixer="loop: repeat"></a-entity>
      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    const id = new URLSearchParams(location.search).get('m');
    const k = EXPERIMENTOS[id] ? id : 'punto_ciego', e = EXPERIMENTOS[k];
    const ent = document.getElementById('exp'), msg = document.getElementById('mensaje');
    document.getElementById('modelo').setAttribute('src', `modelos/${k}.glb`);
    ent.setAttribute('scale', `${e.escala} ${e.escala} ${e.escala}`);
    ent.setAttribute('position', `0 ${e.y} 0`);
    document.title = e.titulo;
    msg.textContent = `Cargando «${e.titulo}»…`;
    ent.addEventListener('model-loaded', () => { msg.textContent = `${e.titulo}: apunta la cámara al marcador Hiro. ${e.pregunta}`; });
    ent.addEventListener('model-error', () => { msg.textContent = '❌ No se pudo cargar el modelo 3D.'; });
  </script>
  <script src="registro-sw.js"></script>
</body>
</html>
